spring.application.name=nearby-marketplace
spring.datasource.url=jdbc:postgresql://ep-spring-sea-axcyqsd6-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
spring.datasource.driver-class-name=org.postgresql.Driver

r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.endpoint=${R2_ENDPOINT}
r2.bucket-name=nearby-marketplace-images
r2.public-url=${R2_PUBLIC_URL}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true