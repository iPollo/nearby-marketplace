<div class="login-page">

  <!-- Painel de marca -->
  <aside class="brand-panel">

    <div class="brand-content">

      <span class="brand-mark">NEARBY Marketplace</span>

      <h1>
        Buy and sell<br>
        without the hassle.
      </h1>

      <p>
        Thousands of products, verified sellers,
        and secure payment all in one place.
      </p>

    </div>

    <!-- Elemento assinatura: vitrine flutuante -->
    <div class="showcase">

      <div class="showcase-card card-a">
        <div class="showcase-thumb"></div>
        <div class="showcase-line short"></div>
        <div class="showcase-line tag">$49</div>
      </div>

      <div class="showcase-card card-b">
        <div class="showcase-thumb"></div>
        <div class="showcase-line short"></div>
        <div class="showcase-line tag">$18</div>
      </div>

      <div class="showcase-card card-c">
        <div class="showcase-thumb"></div>
        <div class="showcase-line short"></div>
        <div class="showcase-line tag">$25</div>
      </div>

    </div>

  </aside>

  <!-- Painel de login -->
  <main class="form-panel">

    <div class="login-card">

      <span class="eyebrow">Welcome back</span>

      <h2>Sign in to your account</h2>

      <p class="subtitle">
        Enter your details to continue.
      </p>

      <form (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            placeholder="you@email.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            placeholder="••••••••">
        </div>

        <div class="form-meta">
          <label class="remember">
            <input type="checkbox">
            Remember me
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button type="submit">Sign in</button>

      </form>

      <p class="signup-hint">
        Don't have an account?
        <a routerLink="/register">Sign up</a>
      </p>

    </div>

  </main>

</div>
