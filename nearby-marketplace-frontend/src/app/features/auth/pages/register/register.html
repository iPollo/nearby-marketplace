<div class="login-page">

  <!-- Painel de marca -->
  <aside class="brand-panel">

    <div class="brand-content">

      <span class="brand-mark">Marketplace</span>

      <h1>
        Start selling<br>
        in minutes.
      </h1>

      <p>
        Create your account and get access to
        thousands of buyers looking for what you offer.
      </p>

    </div>

    <!-- Elemento assinatura: vitrine flutuante -->
    <div class="showcase">

      <div class="showcase-card card-a">
        <div class="showcase-thumb"></div>
        <div class="showcase-line short"></div>
        <div class="showcase-line tag">$49</div>
      </div>

      <div class="showcase-card card-b">
        <div class="showcase-thumb"></div>
        <div class="showcase-line short"></div>
        <div class="showcase-line tag">$18</div>
      </div>

      <div class="showcase-card card-c">
        <div class="showcase-thumb"></div>
        <div class="showcase-line short"></div>
        <div class="showcase-line tag">$25</div>
      </div>

    </div>

  </aside>

  <!-- Painel de cadastro -->
  <main class="form-panel">

    <div class="login-card">

      <span class="eyebrow">Get started</span>

      <h2>Create your account</h2>

      <p class="subtitle">
        Fill in your details to join the marketplace.
      </p>

      <form>

        <div class="form-group">
          <label>Full name</label>
          <input
            type="text"
            placeholder="Your full name">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            placeholder="you@email.com">
        </div>

        <div class="form-row">

          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              placeholder="••••••••">
          </div>

          <div class="form-group">
            <label>Confirm password</label>
            <input
              type="password"
              placeholder="••••••••">
          </div>

        </div>

        <div class="form-meta">
          <label class="remember">
            <input type="checkbox">
            I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <button type="submit">Create account</button>

      </form>

      <p class="signup-hint">
        Already have an account?
        <a routerLink="/login">Sign in</a>
      </p>

    </div>

  </main>

</div>
