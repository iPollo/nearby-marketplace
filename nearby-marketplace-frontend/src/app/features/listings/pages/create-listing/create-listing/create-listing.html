<section class="create-listing-page">

  <div class="form-card">

    <span class="eyebrow">New listing</span>
    <h2>What are you selling?</h2>
    <p class="subtitle">Fill in the details below to publish your listing.</p>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Photo</label>

        @if (previewUrl()) {
          <div class="image-preview">
            <img [src]="previewUrl()" alt="Preview">
            <button type="button" class="remove-image" (click)="removeImage()">Remove</button>
          </div>
        } @else {
          <label class="upload-box">
            <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
              <circle cx="8.5" cy="10" r="1.5" fill="currentColor"/>
              <path d="M21 15l-5-4-4 3-3-2-6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Click to upload a photo</span>
          </label>
        }
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" [(ngModel)]="title" placeholder="e.g. iPhone 13, 128GB" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" [(ngModel)]="description" rows="4" placeholder="Describe the item's condition, details, etc."></textarea>
      </div>

      <div class="form-row">

        <div class="form-group">
          <label>Price (R$)</label>
          <input type="number" name="price" [(ngModel)]="price" min="0" step="0.01" placeholder="0.00" required>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select name="categoryId" [(ngModel)]="categoryId" required>
            <option [ngValue]="null" disabled>Select a category</option>
            @for (category of categories(); track category.id) {
              <option [ngValue]="category.id">{{ category.name }}</option>
            }
          </select>
        </div>

      </div>

      <div class="form-group">
        <label>City</label>
        <select name="cityId" [(ngModel)]="cityId" required>
          <option [ngValue]="null" disabled>Select your city</option>
          @for (city of cities(); track city.id) {
            <option [ngValue]="city.id">{{ city.name }}</option>
          }
        </select>
      </div>

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Publishing...' : 'Publish listing' }}
      </button>

    </form>

  </div>

</section>
