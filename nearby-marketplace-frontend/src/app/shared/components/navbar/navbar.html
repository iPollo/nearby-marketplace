<header class="navbar">

  <div class="navbar-inner">

    <!-- Logo -->
    <a routerLink="/" class="logo">NearBy Marketplace</a>

    <!-- Busca -->
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input
        type="text"
        placeholder="Search products, brands and categories">
    </div>

    <!-- Ações -->
    <div class="navbar-actions">

      <button class="icon-btn" aria-label="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="badge-dot"></span>
      </button>

      <button class="icon-btn" aria-label="Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M6 6h15l-1.5 9h-12z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M6 6L5 2H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="9" cy="20" r="1.5" fill="currentColor"/>
          <circle cx="18" cy="20" r="1.5" fill="currentColor"/>
        </svg>
        <span class="badge-dot"></span>
      </button>

      <button class="user-menu" aria-label="Account">
        <span class="avatar">AL</span>
      </button>

    </div>

  </div>

</header>
